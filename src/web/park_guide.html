<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#733b7c">
  <title>朱迪 · 乐园定位搭档</title>
  <style>
    :root{color-scheme:dark;--pink:#ff86b8;--lav:#c8adff;--ink:#fff9fc;--muted:#dbcfe0;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0,#7a376f 0,transparent 42%),radial-gradient(circle at 100% 30%,#265c6a 0,transparent 34%),#15101d}main{width:min(560px,calc(100% - 28px));margin:auto;padding:calc(24px + env(safe-area-inset-top)) 0 calc(36px + env(safe-area-inset-bottom))}.eyebrow{font-size:12px;letter-spacing:.15em;color:#ffb4d5}.hero{margin:7px 0 22px;font-size:34px;line-height:1.13}.hero span{color:#ffb6d7}.card{background:rgba(45,31,56,.78);border:1px solid var(--line);border-radius:22px;padding:19px;margin:13px 0;box-shadow:0 18px 48px rgba(0,0,0,.2);backdrop-filter:blur(16px)}label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px}select,input{width:100%;border:1px solid var(--line);background:#211829;color:#fff;border-radius:13px;padding:13px;font-size:15px;margin-bottom:13px}button{width:100%;border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:750;color:#29182a;background:linear-gradient(135deg,var(--pink),var(--lav));box-shadow:0 10px 30px rgba(255,134,184,.18)}button.secondary{margin-top:10px;background:rgba(255,255,255,.09);color:#fff;border:1px solid var(--line);box-shadow:none}.status{margin-top:14px;border-radius:14px;padding:13px;background:rgba(255,255,255,.06);line-height:1.55;font-size:14px}.ok{border-left:3px solid #65e6b1}.warn{border-left:3px solid #ffc66d}.manual{display:none;margin-top:16px}.manual.open{display:block}.tiny{color:var(--muted);font-size:12px;line-height:1.55;margin-top:10px}.answer{font-size:16px;line-height:1.65;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid input{margin-bottom:0}
  </style>
</head>
<body><main>
  <div class="eyebrow">ZOOTOPIA PARK PARTNER</div>
  <h1 class="hero">让手机当定位器，<br><span>朱迪在音箱里带路</span> 🐰</h1>
  <section class="card">
    <label for="device">要绑定的语音助手</label><select id="device"></select>
    <button id="locate">允许定位并持续同步</button>
    <button class="secondary" id="manual-toggle">无法定位？手动输入坐标</button>
    <div class="manual" id="manual"><div class="grid"><input id="lat" inputmode="decimal" placeholder="纬度"><input id="lon" inputmode="decimal" placeholder="经度"></div><button class="secondary" id="manual-send">发送手动位置</button></div>
    <div class="status warn" id="status">尚未发送位置。手机浏览器通常要求 HTTPS 才能使用精确定位。</div>
    <div class="tiny">页面需保持打开。位置只保存在演示服务器内存中，超过两分钟未更新后，朱迪会请你重新定位。</div>
  </section>
  <section class="card">
    <label for="destination">先试一条路线</label><select id="destination"></select>
    <button id="route">问朱迪怎么走</button><div class="status answer" id="answer">位置同步成功后，也可以直接对整机说：“去热力追踪怎么走？”</div>
  </section>
</main><script>
const $=s=>document.querySelector(s);let watchId=null;
async function bootstrap(){const d=await fetch('/api/demo/devices').then(r=>r.json());$('#device').innerHTML=d.devices.map(x=>`<option>${x}</option>`).join('');$('#destination').innerHTML=d.pois.map(x=>`<option value="${x.key}">${x.name}</option>`).join('')}
async function postLocation(lat,lon,accuracy){const body={device_id:$('#device').value,latitude:Number(lat),longitude:Number(lon),accuracy:accuracy==null?null:Number(accuracy)};const r=await fetch('/api/demo/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());$('#status').className='status ok';$('#status').textContent=`位置已同步 · 精度约 ${accuracy?Math.round(accuracy)+' 米':'未知'} · ${new Date().toLocaleTimeString()}`}
$('#locate').onclick=()=>{if(!window.isSecureContext){$('#status').textContent='当前是 HTTP 页面，浏览器可能禁用定位。请使用 HTTPS，或展开手动坐标作为演示回退。'}if(!navigator.geolocation){$('#status').textContent='这个浏览器不支持定位。';return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>postLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy).catch(e=>$('#status').textContent='同步失败：'+e.message),e=>{$('#status').className='status warn';$('#status').textContent='定位失败：'+e.message},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})};
$('#manual-toggle').onclick=()=>$('#manual').classList.toggle('open');$('#manual-send').onclick=()=>postLocation($('#lat').value,$('#lon').value,null).catch(e=>$('#status').textContent='发送失败：'+e.message);
$('#route').onclick=async()=>{const u=new URL('/api/demo/navigation',location.origin);u.searchParams.set('device_id',$('#device').value);u.searchParams.set('destination',$('#destination').value);const r=await fetch(u);const d=await r.json();$('#answer').textContent=r.ok?d.answer:(d.detail==='phone_location_missing_or_stale'?'请先同步手机位置。':'路线暂时不可用。')};bootstrap().catch(e=>$('#status').textContent='页面初始化失败：'+e.message);
</script></body></html>
